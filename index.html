<style>
:root{
  color-scheme: dark;
  --bg:#0c0f0e; --surface:#151918; --surface2:#1e2422; --ink:#f2f4f2; --muted:#9aa8a1; --line:#2a3230;
  --red:#fe2c55; --gold:#f5b921; --gold-ink:#ffd964;
  --chip:#f2f4f2; --chip-ink:#101312;
}
*{box-sizing:border-box} html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;line-height:1.5;overflow-x:clip;max-width:100vw}
a{color:inherit}
img,svg,video{max-width:100%}
.mono{font-family:"JetBrains Mono",monospace}
.wrap{max-width:1180px;width:100%;margin:0 auto;padding:0 18px 56px;min-width:0}
.top{padding:28px 0 8px}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px rgba(254,44,85,.18)}
.kicker span{color:var(--muted)}
h1{font-size:clamp(34px,6vw,58px);line-height:.98;letter-spacing:-.03em;margin:14px 0 12px;font-weight:900}
h1 em{font-style:normal;color:var(--red)}
.lede{font-size:17px;color:var(--muted);max-width:720px;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{font-size:28px;display:block;line-height:1}
.stat span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.controls{padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
.trend-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--red);color:#fff;padding:5px 9px;border-radius:999px;white-space:nowrap;vertical-align:middle;margin-left:8px;line-height:1;box-shadow:0 2px 10px rgba(254,44,85,.35)}
#toTop{position:fixed;right:18px;bottom:18px;z-index:40;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:22px;font-weight:900;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .22s ease,transform .22s ease,background .18s ease}
#toTop.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#toTop:hover{background:var(--red);color:#fff;border-color:var(--red)}
#toTop:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.controls input[type=search]{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;font-weight:600;margin-bottom:10px;min-height:48px}
.pills{display:flex;flex-wrap:nowrap;gap:8px;flex:0 0 auto;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 13px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;min-height:44px;flex:0 0 auto;white-space:nowrap}
.pill.active{background:var(--chip);color:var(--chip-ink);border-color:var(--chip)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;min-width:0}
.filter-row{display:flex;flex-wrap:nowrap;flex-direction:row;align-items:center;gap:10px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;padding:2px 2px 6px;scroll-padding:0 2px}
.filter-row::-webkit-scrollbar{display:none;width:0;height:0}
.filter-row>*{flex:0 0 auto}
.filter-row .viewtoggle{flex:0 0 auto}
.filter-row select{flex:0 0 auto;width:auto;max-width:260px}
.filter-row .toggle{flex:0 0 auto;width:auto;white-space:nowrap;padding-right:4px}
.row select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;max-width:100%;min-height:44px;min-width:0}
.toggle{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center;cursor:pointer;min-height:44px;white-space:nowrap}
.toggle input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--red)}
.viewtoggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;max-width:none;flex:0 0 auto}
.viewtoggle button{border:0;background:var(--surface);color:var(--ink);padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;min-height:40px;white-space:nowrap}
.viewtoggle button.active{background:var(--chip);color:var(--chip-ink)}
section{margin-top:30px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-head>div{min-width:0;flex:1 1 220px}
.sec-head h2{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.15;overflow-wrap:break-word}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:14px;overflow-wrap:break-word}
.badge{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--surface2);padding:6px 9px;border-radius:999px;white-space:nowrap;max-width:100%}
.sub-head{display:flex;align-items:center;gap:10px;margin:22px 0 12px;flex-wrap:wrap}
.sub-head h3{margin:0;font-size:18px;overflow-wrap:break-word;min-width:0}
.sub-head .count{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.sub-head .rule{flex:1 1 40px;height:1px;background:var(--line);min-width:24px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;min-width:0}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow-wrap:break-word}
.card.top{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(245,185,33,.15)}
.card-head{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#fff;flex:0 0 auto;font-size:15px}
.card h3{margin:0;font-size:16px;line-height:1.15;word-break:break-word}
.card h3 a{text-decoration:none}.card h3 a:hover{text-decoration:underline}
.sub{font-size:12px;color:var(--muted);font-weight:700}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num{background:var(--surface2);border-radius:10px;padding:8px}
.num b{display:block;font-size:14px;line-height:1.3}.num span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800}
.why{font-size:13.5px;color:var(--muted);margin:0;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:800;padding:5px 7px;border-radius:999px;background:var(--surface2)}
.tag.ok{background:#123524;color:#7be2a8}.tag.warn{background:#3a2a08;color:#ffcf7a}
.tag.niche{background:#26203a;color:#c9bfff}
.tag.star{background:#3a2f08;color:var(--gold-ink)}
.tag.fit{background:#3a1219;color:#ff9db0}
.card.trend{border-top:3px solid var(--red)}
.card.trend h3{font-size:17px}
.trend .sig{font-size:12.5px;color:var(--muted);margin:0}
.trend .sig b{color:var(--ink);font-weight:800}
.card a.go{font-weight:800;font-size:13px;text-decoration:none;color:var(--red)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.news{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.news article{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.news article.top{border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(245,185,33,.15)}
.news h3{margin:8px 0 6px;font-size:16px;line-height:1.3;overflow-wrap:break-word}
.news p{color:var(--muted);font-size:14px;margin:0;overflow-wrap:break-word}
.news .meta{font-size:12px;font-weight:700;color:var(--muted);margin-top:10px;overflow-wrap:anywhere}
.news .meta b{color:var(--ink)}
.news article{min-width:0}
footer{margin-top:34px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px;overflow-wrap:break-word}
.num b{overflow-wrap:break-word}
.card a.go{padding:6px 0;min-height:32px;display:inline-flex;align-items:center}

  .grid{grid-template-columns:1fr}
  .news{grid-template-columns:1fr}
  .controls{padding:12px 0}

  .filter-row select{width:auto;flex:0 0 auto;max-width:240px;min-height:44px}
  .filter-row .toggle{width:auto;flex:0 0 auto;min-height:44px}
  .card{padding:15px}
  .card.trend h3{font-size:16px}
  #toTop{width:44px;height:44px;font-size:20px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}

@media(max-width:430px){
  .wrap{padding:0 12px 88px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:12px}
  .stat b{font-size:22px}
  .stat span{font-size:11px}
  .stat p{font-size:12.5px}
  .nums{grid-template-columns:1fr 1fr;gap:7px}
  .num{padding:7px}
  .num b{font-size:13px}
  .avatar{width:44px;height:44px;border-radius:12px}
  .trend-badge{font-size:10.5px;padding:5px 8px}
}
@media(max-width:360px){
  h1{font-size:29px}
  .stats{grid-template-columns:1fr}
  .stat{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px}
  .stat b{font-size:22px}
  .stat p{flex:1 1 100%}
  .nums{grid-template-columns:1fr}
  .sec-head h2{font-size:19.5px}
  .viewtoggle button{font-size:12.5px}
}
</style>
</head>

    if(state.mono && !isMono(a)) return false;
    if(state.q){
      var hay=(a.handle+" "+a.niche+" "+a.why+" "+a.category).toLowerCase();
      if(hay.indexOf(state.q.toLowerCase())<0) return false;
    }
    return true;
  });
}
function cardHTML(a){
  var mono=isMono(a);
  return '<article class="card'+(a.top?' top':'')+'">'+
    '<div class="card-head"><div class="avatar" style="background:'+colorFor(a.handle)+'">'+esc(initials(a.handle))+'</div>'+
    '<div><h3><a href="'+esc(a.link)+'" target="_blank" rel="noopener">'+esc(a.handle)+'</a></h3>'+
    '<div class="sub">'+(a.category==="AI"?"🤖 AI":"✂️ Clipping")+' • '+esc(a.date)+'</div></div></div>'+
    '<div class="nums"><div class="num"><b>'+esc(a.followers)+'</b><span>Followers</span></div><div class="num"><b>'+esc(a.views)+'</b><span>Views</span></div></div>'+
    '<p class="why">'+esc(a.why)+'</p>'+
    '<div class="tags"><span class="tag niche">'+esc(a.niche)+'</span>'+
    '<span class="tag '+(mono?'ok':'warn')+'">'+esc(a.monetizable)+' '+(mono?'Monetizable':'Short / check')+'</span>'+
    '<span class="tag">⏱ '+esc(a.length)+'</span>'+(a.top?'<span class="tag star">⭐ Top pick</span>':'')+'</div>'+
    '<a class="go" href="'+esc(a.link)+'" target="_blank" rel="noopener">Open TikTok profile →</a></article>';
}
function byViewsDesc(list){ return list.slice().sort(function(x,y){ return parseNum(y.views)-parseNum(x.views); }); }

function renderDateView(list){
  var html="";
  dates.forEach(function(d){
    var dayList=list.filter(function(a){return a.date===d});
    if(!dayList.length) return;
    var dayTop=dayList.filter(function(a){return a.top})[0];
    html+='<section><div class="sec-head"><div><h2>📅 '+fmtDate(d)+'</h2><p>'+dayList.length+' accounts'+(dayTop?' • ⭐ Top pick: '+esc(dayTop.handle):'')+'</p></div><span class="badge">'+d+'</span></div>';
    [["AI","🤖 AI Accounts"],["Clipping","✂️ Clipping Accounts"]].forEach(function(pair){
      var sub=byViewsDesc(dayList.filter(function(a){return a.category===pair[0]}));
      if(!sub.length) return;
      html+='<div class="sub-head"><h3>'+pair[1]+'</h3><span class="count">'+sub.length+' accounts</span><span class="rule"></span></div><div class="grid">'+sub.map(cardHTML).join("")+'</div>';
    });
    html+='</section>';
  });
  return html;
}
function renderNicheView(list){
  var groups={}, order=[];
  list.forEach(function(a){ var k=nicheKey(a); if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(a); });
  order.sort(function(x,y){ return groups[y].length-groups[x].length || (x<y?-1:1); });
  return order.map(function(k){
    var items=byViewsDesc(groups[k]);
    var cats={}; items.forEach(function(a){cats[a.category]=1;});
    var catLabel=Object.keys(cats).map(function(c){return c==="AI"?"🤖 AI":"✂️ Clipping"}).join(" + ");
    return '<section><div class="sec-head"><div><h2>'+esc(k)+trendingBadge(k)+'</h2><p>'+items.length+' account'+(items.length>1?'s':'')+' • '+catLabel+'</p></div><span class="badge">'+esc(k)+'</span></div><div class="grid">'+items.map(cardHTML).join("")+'</div></section>';
  }).join("");
}
function render(){
  renderControls();
  var list=filtered();
  var dateTotal=ACCOUNTS.filter(function(a){return a.date===state.date}).length;
  document.getElementById("count").textContent="Showing "+list.length+" of "+dateTotal+" accounts • "+fmtDate(state.date)+" • "+(state.view==="date"?"Grouped by date":"Grouped by niche category");
  document.getElementById("groups").innerHTML = list.length
    ? (state.view==="date" ? renderDateView(list) : renderNicheView(list))
    : '<div class="empty" style="margin-top:24px">No accounts match these filters. Try “All categories”, clear the niche filter, or clear the search.</div>';
}
document.getElementById("q").addEventListener("input",function(e){ state.q=e.target.value; render(); });
document.getElementById("monoOnly").addEventListener("change",function(e){ state.mono=e.target.checked; render(); });
document.getElementById("nicheFilter").addEventListener("change",function(e){ state.niche=e.target.value; render(); });
document.getElementById("dateFilter").addEventListener("change",function(e){ state.date=e.target.value; var opts=nicheOptions(); if(state.niche!=="All" && opts.indexOf(state.niche)<0) state.niche="All"; render(); });
document.getElementById("viewDate").addEventListener("click",function(){ state.view="date"; render(); });
document.getElementById("viewNiche").addEventListener("click",function(){ state.view="niche"; render(); });
render();

/* ---- Back to top ---- */
(function(){
  var btn=document.getElementById("toTop");
  if(!btn) return;
  function onScroll(){
    if(window.scrollY>420 || document.documentElement.scrollTop>420) btn.classList.add("show");
    else btn.classList.remove("show");
  }
  window.addEventListener("scroll",onScroll,{passive:true});
  onScroll();
  btn.addEventListener("click",function(){
    window.scrollTo({top:0,behavior:"smooth"});
  });
})();
</script>
</body>
</html>
