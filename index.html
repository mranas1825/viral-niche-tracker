var ACCOUNTS = DATA.accounts;
var NEWS = DATA.news;
var TRENDING = DATA.trending || [];

function parseNum(s){
  if(!s) return 0;
  var m = String(s).replace(/,/g,"").match(/([\d.]+)\s*([KMB])?/i);
  if(!m) return 0;
  var v = parseFloat(m[1]);
  var u = (m[2]||"").toUpperCase();
  if(u==="K") v*=1e3; else if(u==="M") v*=1e6; else if(u==="B") v*=1e9;
  return v;
}
var COLORS=["#b42318","#0f766e","#175cd3","#6941c6","#dc6803","#c11574","#363f72","#027a48","#93370d","#7a4a00"];
function colorFor(h){var n=0;for(var i=0;i<h.length;i++)n+=h.charCodeAt(i);return COLORS[n%COLORS.length]}
function initials(h){return h.replace("@","").split(/[._]/).map(function(x){return x[0]||""}).join("").slice(0,2).toUpperCase()}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmtDate(dstr){
  var p=dstr.split("-"); var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  var days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return days[d.getUTCDay()]+", "+months[d.getUTCMonth()]+" "+d.getUTCDate()+", "+d.getUTCFullYear();
}
function isMono(a){return String(a.monetizable).indexOf("✅")===0}

/* Niche normalization for the By Niche view + niche filter */
function nicheKey(a){
  var n=String(a.niche||"").trim();
  if(a.category==="Clipping"){
    var low=n.toLowerCase();
    if(low==="movies"||low==="movie") return "Movie";
    if(low.indexOf("reddit")===0) return "Reddit Stories";
    if(low.indexOf("finance")===0||low.indexOf("business")===0) return "Finance/Business";
    if(low.indexOf("luxury")===0||low.indexOf("lifestyle")===0) return "Luxury/Lifestyle";
    return n.charAt(0).toUpperCase()+n.slice(1);
  }
  return n;
}

/* ---- Computed stats ---- */
var dates = []; ACCOUNTS.forEach(function(a){ if(dates.indexOf(a.date)<0) dates.push(a.date); });
dates.sort().reverse();
var latestDate = dates[0];
var aiCount = ACCOUNTS.filter(function(a){return a.category==="AI"}).length;
var clipCount = ACCOUNTS.length - aiCount;
var monoCount = ACCOUNTS.filter(isMono).length;
document.getElementById("foot").textContent = "Data: the owner's daily Viral Content Tracker — "+ACCOUNTS.length+" accounts recorded "+fmtDate(dates[dates.length-1])+" to "+fmtDate(latestDate)+". Follower/view numbers are as recorded on each account's date and will change. Always open the TikTok profile before replicating a format to confirm the account is still active.";
/* ---- Header stats (all values computed from embedded DATA) ---- */
var allDates=[]; ACCOUNTS.forEach(function(a){ if(allDates.indexOf(a.date)<0) allDates.push(a.date); }); NEWS.forEach(function(n){ if(allDates.indexOf(n.date)<0) allDates.push(n.date); }); (TRENDING||[]).forEach(function(t){ if(allDates.indexOf(t.date)<0) allDates.push(t.date); }); allDates.sort().reverse();
var lastUpdated = allDates[0];
var newsDates=[]; NEWS.forEach(function(n){ if(newsDates.indexOf(n.date)<0) newsDates.push(n.date); }); newsDates.sort().reverse();
var newsLatest = newsDates[0];
function shortDate(dstr){ return fmtDate(dstr).replace(/^[^,]+, /,""); }
document.getElementById("stats").innerHTML =
  '<div class="stat"><b>'+ACCOUNTS.length+'</b><span>Accounts tracked</span><p>'+shortDate(dates[dates.length-1])+' – '+shortDate(latestDate)+' • ✅ '+monoCount+' monetizable (1min+)</p></div>'+
  '<div class="stat"><b>'+aiCount+'</b><span>🤖 AI accounts</span><p>'+Math.round(aiCount/ACCOUNTS.length*100)+'% of all tracked accounts</p></div>'+
  '<div class="stat"><b>'+clipCount+'</b><span>✂️ Clipping accounts</span><p>'+Math.round(clipCount/ACCOUNTS.length*100)+'% of all tracked accounts</p></div>'+

/* ---- Trending / hot niche logic ---- */
function viewsHas1M(s){
  if(!s) return false;
  var str=String(s);
  var m=str.match(/([\d.]+)\s*M\b/i);
  if(m && parseFloat(m[1])>=1) return true;
  var b=str.match(/([\d.]+)\s*B\b/i);
  if(b && parseFloat(b[1])>=1) return true;
  return false;
}
function isHotNiche(k){
  var kl=String(k||"").toLowerCase().trim();
  if(!kl) return false;
  /* (a) name matches or appears in latest date's trending entries */
  var trendEntries=TRENDING.filter(function(t){return t.date===latestDate});
  if(!trendEntries.length && TRENDING.length){
    var td=[]; TRENDING.forEach(function(t){ if(td.indexOf(t.date)<0) td.push(t.date); }); td.sort().reverse();
    trendEntries=TRENDING.filter(function(t){return t.date===td[0]});
  }
  for(var i=0;i<trendEntries.length;i++){
    var tn=String(trendEntries[i].name||"").toLowerCase();
    var tdsc=String(trendEntries[i].desc||"").toLowerCase();
    var combined=tn+" "+tdsc+" "+String(trendEntries[i].signal||"").toLowerCase();
    if(tn===kl) return true;
    if(combined.indexOf(kl)>=0) return true;
    if(tn && kl.indexOf(tn)>=0) return true;
    /* word-level: if niche is single word, check if it appears as word in trending name */
    if(kl.indexOf(" ")<0 && tn.indexOf(kl)>=0) return true;
  }
  /* (b) + (c) from latest date's accounts in this niche */
  var latestAcc=ACCOUNTS.filter(function(a){return a.date===latestDate && nicheKey(a)===k});
  for(var j=0;j<latestAcc.length;j++){
    if(latestAcc[j].top) return true;
    if(viewsHas1M(latestAcc[j].views)) return true;
  }
  return false;
}
var _hotCache={};
function trendingBadge(k){
  if(!(k in _hotCache)) _hotCache[k]=isHotNiche(k);
  return _hotCache[k] ? '<span class="trend-badge" aria-label="Trending niche">📈 Trending</span>' : '';
}

/* ---- Filters & views ---- */
var state={view:"date",cat:"All",niche:"All",q:"",mono:false,date:latestDate};

function nicheOptions(){
  var seen={}, list=[];
  ACCOUNTS.forEach(function(a){ if(state.date && a.date!==state.date) return; var k=nicheKey(a); if(!seen[k]){seen[k]=1;list.push(k);} });
  list.sort();
  return list;
}
function renderControls(){
  var dateSel=document.getElementById("dateFilter");
  if(dateSel){
    dateSel.innerHTML=dates.map(function(d){
      var short=fmtDate(d).replace(/^[^,]+, /,"");
      var label="📅 "+short+(d===latestDate?" • Latest":"");
      return '<option value="'+esc(d)+'"'+(state.date===d?' selected':'')+'>'+esc(label)+'</option>';
    }).join("");
  }
  document.getElementById("catPills").innerHTML=["All","AI","Clipping"].map(function(c){
    return '<button class="pill '+(state.cat===c?'active':'')+'" data-cat="'+c+'">'+(c==="AI"?"🤖 AI":c==="Clipping"?"✂️ Clipping":"All categories")+'</button>';
  }).join("");
  document.querySelectorAll("[data-cat]").forEach(function(b){ b.onclick=function(){ state.cat=b.getAttribute("data-cat"); render(); }; });
  var sel=document.getElementById("nicheFilter");
  sel.innerHTML='<option value="All">All niches</option>'+nicheOptions().map(function(n){
    return '<option value="'+esc(n)+'"'+(state.niche===n?' selected':'')+'>'+esc(n)+'</option>';
  }).join("");
  document.getElementById("viewDate").classList.toggle("active", state.view==="date");
  document.getElementById("viewNiche").classList.toggle("active", state.view==="niche");
}
function filtered(){
  return ACCOUNTS.filter(function(a){
    if(state.date && a.date!==state.date) return false;
    if(state.cat!=="All" && a.category!==state.cat) return false;
    if(state.niche!=="All" && nicheKey(a)!==state.niche) return false;
    if(state.mono && !isMono(a)) return false;
    if(state.q){
      var hay=(a.handle+" "+a.niche+" "+a.why+" "+a.category).toLowerCase();
      if(hay.indexOf(state.q.toLowerCase())<0) return false;
    }
    return true;
  });
}
function cardHTML(a){
  var mono=isMono(a);
  return '<article class="card'+(a.top?' top':'')+'">'+
    '<div class="card-head"><div class="avatar" style="background:'+colorFor(a.handle)+'">'+esc(initials(a.handle))+'</div>'+
    '<div><h3><a href="'+esc(a.link)+'" target="_blank" rel="noopener">'+esc(a.handle)+'</a></h3>'+
    '<div class="sub">'+(a.category==="AI"?"🤖 AI":"✂️ Clipping")+' • '+esc(a.date)+'</div></div></div>'+
    '<div class="nums"><div class="num"><b>'+esc(a.followers)+'</b><span>Followers</span></div><div class="num"><b>'+esc(a.views)+'</b><span>Views</span></div></div>'+
    '<p class="why">'+esc(a.why)+'</p>'+
    '<div class="tags"><span class="tag niche">'+esc(a.niche)+'</span>'+
    '<span class="tag '+(mono?'ok':'warn')+'">'+esc(a.monetizable)+' '+(mono?'Monetizable':'Short / check')+'</span>'+
    '<span class="tag">⏱ '+esc(a.length)+'</span>'+(a.top?'<span class="tag star">⭐ Top pick</span>':'')+'</div>'+
    '<a class="go" href="'+esc(a.link)+'" target="_blank" rel="noopener">Open TikTok profile →</a></article>';
}
function byViewsDesc(list){ return list.slice().sort(function(x,y){ return parseNum(y.views)-parseNum(x.views); }); }

function renderDateView(list){
  var html="";
  dates.forEach(function(d){
    var dayList=list.filter(function(a){return a.date===d});
    if(!dayList.length) return;
    var dayTop=dayList.filter(function(a){return a.top})[0];
    html+='<section><div class="sec-head"><div><h2>📅 '+fmtDate(d)+'</h2><p>'+dayList.length+' accounts'+(dayTop?' • ⭐ Top pick: '+esc(dayTop.handle):'')+'</p></div><span class="badge">'+d+'</span></div>';
    [["AI","🤖 AI Accounts"],["Clipping","✂️ Clipping Accounts"]].forEach(function(pair){
      var sub=byViewsDesc(dayList.filter(function(a){return a.category===pair[0]}));
      if(!sub.length) return;
      html+='<div class="sub-head"><h3>'+pair[1]+'</h3><span class="count">'+sub.length+' accounts</span><span class="rule"></span></div><div class="grid">'+sub.map(cardHTML).join("")+'</div>';
    });
    html+='</section>';
  });
  return html;
}
function renderNicheView(list){
  var groups={}, order=[];
  list.forEach(function(a){ var k=nicheKey(a); if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(a); });
  order.sort(function(x,y){ return groups[y].length-groups[x].length || (x<y?-1:1); });
  return order.map(function(k){
    var items=byViewsDesc(groups[k]);
    var cats={}; items.forEach(function(a){cats[a.category]=1;});
    var catLabel=Object.keys(cats).map(function(c){return c==="AI"?"🤖 AI":"✂️ Clipping"}).join(" + ");
    return '<section><div class="sec-head"><div><h2>'+esc(k)+trendingBadge(k)+'</h2><p>'+items.length+' account'+(items.length>1?'s':'')+' • '+catLabel+'</p></div><span class="badge">'+esc(k)+'</span></div><div class="grid">'+items.map(cardHTML).join("")+'</div></section>';
  }).join("");
}
function render(){
  renderControls();
  var list=filtered();
  var dateTotal=ACCOUNTS.filter(function(a){return a.date===state.date}).length;
  document.getElementById("count").textContent="Showing "+list.length+" of "+dateTotal+" accounts • "+fmtDate(state.date)+" • "+(state.view==="date"?"Grouped by date":"Grouped by niche category");
  document.getElementById("groups").innerHTML = list.length
    ? (state.view==="date" ? renderDateView(list) : renderNicheView(list))
    : '<div class="empty" style="margin-top:24px">No accounts match these filters. Try “All categories”, clear the niche filter, or clear the search.</div>';
}
document.getElementById("q").addEventListener("input",function(e){ state.q=e.target.value; render(); });
document.getElementById("monoOnly").addEventListener("change",function(e){ state.mono=e.target.checked; render(); });
document.getElementById("nicheFilter").addEventListener("change",function(e){ state.niche=e.target.value; render(); });
document.getElementById("dateFilter").addEventListener("change",function(e){ state.date=e.target.value; var opts=nicheOptions(); if(state.niche!=="All" && opts.indexOf(state.niche)<0) state.niche="All"; render(); });
document.getElementById("viewDate").addEventListener("click",function(){ state.view="date"; render(); });
document.getElementById("viewNiche").addEventListener("click",function(){ state.view="niche"; render(); });
render();

/* ---- Back to top ---- */
(function(){
  var btn=document.getElementById("toTop");
  if(!btn) return;
  function onScroll(){
    if(window.scrollY>420 || document.documentElement.scrollTop>420) btn.classList.add("show");
    else btn.classList.remove("show");
  }
  window.addEventListener("scroll",onScroll,{passive:true});
  onScroll();
  btn.addEventListener("click",function(){
    window.scrollTo({top:0,behavior:"smooth"});
  });
})();
</script>
</body>
</html>
